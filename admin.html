<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐝 蜂蜜小铺 - 后台管理</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decor">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- 顶部导航 -->
    <header class="header admin-header">
        <div class="header-inner">
            <div class="header-left">
                <div class="logo-wrap">
                    <span class="logo-icon">🔧 </span>
                    <div class="logo-text">
                        <h1 class="logo-title">后台管理</h1>
                        <p class="logo-sub">管理订单和商品~</p>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <a href="index.html" class="btn-outline" target="_blank">
                    <i class="fas fa-external-link-alt"></i> 预览店铺
                </a>
            </div>
        </div>
    </header>

    <div class="admin-container">
        <!-- Tab切换 -->
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('orders')">
                <span class="tab-icon"><i class="fas fa-list-check"></i></span>
                <span class="tab-text">订单管理</span>
                <span class="tab-badge" id="orderBadge">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('products')">
                <span class="tab-icon"><i class="fas fa-boxes"></i></span>
                <span class="tab-text">商品管理</span>
            </button>
        </div>

        <!-- 订单管理面板 -->
        <div class="tab-panel active" id="ordersPanel">
            <div class="panel-header">
                <div class="panel-title">
                    <span class="title-emoji">📋</span>
                    <h2>收到的订单</h2>
                </div>
                <div class="filter-btns">
                    <button class="filter-btn active" onclick="filterOrders('all')">全部</button>
                    <button class="filter-btn" onclick="filterOrders('pending')">⏳ 待处理</button>
                    <button class="filter-btn" onclick="filterOrders('done')">✅ 已完成</button>
                </div>
            </div>
            <div class="orders-list" id="ordersList">
                <div class="empty-state">
                    <div class="empty-emoji">💌</div>
                    <p class="empty-text">暂无订单~</p>
                    <p class="empty-sub">快让她来下单吧！</p>
                </div>
            </div>
        </div>

        <!-- 商品管理面板 -->
        <div class="tab-panel" id="productsPanel">
            <div class="panel-header">
                <div class="panel-title">
                    <span class="title-emoji">📦</span>
                    <h2>商品管理</h2>
                </div>
                <button class="btn-primary" onclick="showAddProduct()">
                    <i class="fas fa-plus"></i> 添加商品
                </button>
            </div>
            <div class="products-admin-list" id="productsAdminList"></div>
        </div>
    </div>

    <!-- 商品编辑弹窗 -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <span class="modal-title-icon" id="modalIcon">➕</span>
                    <h3 id="modalTitle">添加商品</h3>
                </div>
                <button class="btn-close" onclick="closeProductModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editProductId">

                <div class="form-group">
                    <label><i class="fas fa-cookie-bite"></i> 商品名称</label>
                    <input type="text" id="productName" placeholder="如：冰淇淋🍦">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-folder-open"></i> 分类</label>
                    <select id="productCategory">
                        <option value="food">🍔 好吃的</option>
                        <option value="drink">🥤 好喝的</option>
                        <option value="activity">🎯 想做的事</option>
                        <option value="love">💕 恋爱互动</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-tag"></i> 价格（或描述）</label>
                    <input type="text" id="productPrice" placeholder="如：免费 / ¥15 / 一个抱抱">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-face-smile"></i> Emoji图标</label>
                    <input type="text" id="productEmoji" placeholder="如：🍦" maxlength="4">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-align-left"></i> 描述</label>
                    <textarea id="productDesc" rows="2" placeholder="简单描述一下这个商品~"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-outline" onclick="closeProductModal()">
                    <i class="fas fa-times"></i> 取消
                </button>
                <button class="btn-primary" id="btnSaveProduct" onclick="saveProduct()">
                    <i class="fas fa-check"></i> 保存
                </button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast">
        <span class="toast-icon"><i class="fas fa-check"></i></span>
        <span class="toast-text"></span>
    </div>

    <script src="js/data.js"></script>
    <script>
// ========== 后台管理逻辑（内嵌版） ==========
var currentTab = 'orders';
var orderFilter = 'all';
var editingProductId = null;
var unsubscribeOrders = null;

document.addEventListener('DOMContentLoaded', function() {
    initDefaultProducts().then(function() {
        return getOrders();
    }).then(function(orders) {
        renderOrdersFromData(orders);
        updateOrderBadge();
        startOrdersListener();
        renderProductsAdmin();
    });
});

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    var btns = document.querySelectorAll('.tab-btn');
    if (tab === 'orders') btns[0].classList.add('active');
    else btns[1].classList.add('active');
    document.getElementById(tab === 'orders' ? 'ordersPanel' : 'productsPanel').classList.add('active');
    if (tab === 'orders') getOrders().then(function(orders) { renderOrdersFromData(orders); });
    if (tab === 'products') renderProductsAdmin();
}

function startOrdersListener() {
    unsubscribeOrders = onOrdersSnapshot(function(orders) {
        renderOrdersFromData(orders);
        updateOrderBadge();
    });
}

function renderOrdersFromData(orders) {
    var filtered = orderFilter === 'all' ? orders : orders.filter(function(o) { return o.status === orderFilter; });
    renderOrderCards(filtered);
}

function renderOrderCards(filtered) {
    var container = document.getElementById('ordersList');
    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-emoji">�</div><p class="empty-text">暂无订单~</p><p class="empty-sub">快让她来下单吧！</p></div>';
        return;
    }
    // 最新订单在最上面
    var sorted = filtered.slice().reverse();
    container.innerHTML = sorted.map(function(order) {
        var itemsHTML = order.items.map(function(item) {
            return '<span class="order-item-tag"><span class="tag-emoji">' + (item.emoji || '') + '</span>' + item.name + ' ×' + item.qty + '</span>';
        }).join('');
        var noteHTML = order.note ? '<div class="order-note"><i class="fas fa-quote-left"></i> ' + escapeHtml(order.note) + ' <i class="fas fa-quote-right"></i></div>' : '';
        var doneBtn = order.status === 'pending' ?
            '<button class="btn-sm btn-done" onclick="doneOrder(\'' + order._firestoreId + '\')"><i class="fas fa-check"></i> 标记完成</button>' : '';
        return '<div class="order-card ' + order.status + '">' +
            '<div class="order-card-header">' +
                '<span class="order-time"><i class="far fa-clock"></i> ' + (order.timeDisplay || '') + '</span>' +
                '<span class="order-status ' + order.status + '">' + (order.status === 'pending' ? '⏳ 待处理' : '✅ 已完成') + '</span>' +
            '</div>' +
            '<div class="order-items">' + itemsHTML + '</div>' +
            noteHTML +
            '<div class="order-actions">' + doneBtn +
                '<button class="btn-sm btn-delete" onclick="removeOrder(\'' + order._firestoreId + '\')"><i class="fas fa-trash"></i> 删除</button>' +
            '</div>' +
        '</div>';
    }).join('');
}

function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function filterOrders(filter) {
    orderFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    var btns = document.querySelectorAll('.filter-btn');
    if (filter === 'all') btns[0].classList.add('active');
    else if (filter === 'pending') btns[1].classList.add('active');
    else btns[2].classList.add('active');
    getOrders().then(function(orders) { renderOrdersFromData(orders); });
}

function doneOrder(id) {
    markOrderDone(id).then(function() {
        getOrders().then(function(orders) { renderOrdersFromData(orders); });
        updateOrderBadge();
        showToast('已标记为完成 ✅', 'success');
    });
}

function removeOrder(id) {
    if (confirm('确定要删除这个订单吗？')) {
        deleteOrder(id).then(function() {
            getOrders().then(function(orders) { renderOrdersFromData(orders); });
            updateOrderBadge();
            showToast('订单已删除', 'success');
        });
    }
}

function updateOrderBadge() {
    getPendingCount().then(function(count) {
        var badge = document.getElementById('orderBadge');
        if (badge) {
            badge.textContent = count;
            badge.style.display = count > 0 ? 'inline-flex' : 'none';
        }
    });
}

function renderProductsAdmin() {
    getProducts().then(function(products) {
        var container = document.getElementById('productsAdminList');
        if (products.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-emoji">📦</div><p class="empty-text">还没有商品~</p><p class="empty-sub">点击右上角添加吧！</p></div>';
            return;
        }
        container.innerHTML = products.map(function(p) {
            var catInfo = (CATEGORIES[p.category] ? CATEGORIES[p.category].icon + ' ' + CATEGORIES[p.category].name : p.category);
            return '<div class="product-admin-item">' +
                '<div class="product-admin-emoji-wrap"><span class="product-admin-emoji">' + (p.emoji || '🎁') + '</span></div>' +
                '<div class="product-admin-info">' +
                    '<div class="product-admin-name">' + escapeHtml(p.name) + '</div>' +
                    '<div class="product-admin-meta"><span class="meta-tag">' + catInfo + '</span><span class="meta-divider">·</span><span class="meta-price">' + escapeHtml(p.price) + '</span>' + (p.desc ? '<span class="meta-divider">·</span><span class="meta-desc">' + escapeHtml(p.desc) + '</span>' : '') + '</div>' +
                '</div>' +
                '<div class="product-admin-actions">' +
                    '<button class="btn-icon" title="编辑" onclick="editProduct(' + p.id + ')"><i class="fas fa-pen"></i></button>' +
                    '<button class="btn-icon danger" title="删除" onclick="removeProduct(' + p.id + ')"><i class="fas fa-trash"></i></button>' +
                '</div>' +
            '</div>';
        }).join('');
    });
}

function showAddProduct() {
    editingProductId = null;
    document.getElementById('modalTitle').textContent = '添加商品';
    document.getElementById('modalIcon').textContent = '➕';
    document.getElementById('btnSaveProduct').innerHTML = '<i class="fas fa-plus"></i> 添加';
    clearProductForm();
    document.getElementById('productModal').classList.add('show');
}

function editProduct(id) {
    getProducts().then(function(products) {
        var product = products.find(function(p) { return p.id === id; });
        if (!product) return;
        editingProductId = id;
        document.getElementById('modalTitle').textContent = '编辑商品';
        document.getElementById('modalIcon').textContent = '✏️';
        document.getElementById('btnSaveProduct').innerHTML = '<i class="fas fa-check"></i> 保存修改';
        document.getElementById('editProductId').value = id;
        document.getElementById('productName').value = product.name;
        document.getElementById('productCategory').value = product.category;
        document.getElementById('productPrice').value = product.price;
        document.getElementById('productEmoji').value = product.emoji || '';
        document.getElementById('productDesc').value = product.desc || '';
        document.getElementById('productModal').classList.add('show');
    });
}

function closeProductModal() { document.getElementById('productModal').classList.remove('show'); clearProductForm(); }
function clearProductForm() {
    document.getElementById('editProductId').value = '';
    document.getElementById('productName').value = '';
    document.getElementById('productCategory').value = 'food';
    document.getElementById('productPrice').value = '';
    document.getElementById('productEmoji').value = '';
    document.getElementById('productDesc').value = '';
}

function saveProduct() {
    var name = document.getElementById('productName').value.trim();
    var category = document.getElementById('productCategory').value;
    var price = document.getElementById('productPrice').value.trim();
    var emoji = document.getElementById('productEmoji').value.trim();
    var desc = document.getElementById('productDesc').value.trim();
    if (!name) { showToast('请输入商品名称', 'error'); return; }
    if (!price) { showToast('请输入价格或描述', 'error'); return; }
    var id = document.getElementById('editProductId').value;
    var promise = id ? updateProduct(parseInt(id), { name: name, category: category, price: price, emoji: emoji, desc: desc }) : addProduct({ name: name, category: category, price: price, emoji: emoji, desc: desc });
    promise.then(function() {
        showToast(id ? '商品已更新 ✅' : '商品已添加 🎉', 'success');
        closeProductModal();
        renderProductsAdmin();
    });
}

function removeProduct(id) {
    if (confirm('确定要删除这个商品吗？')) {
        deleteProduct(id).then(function() { renderProductsAdmin(); showToast('商品已删除', 'success'); });
    }
}

function showToast(msg, type) {
    var toast = document.getElementById('toast');
    toast.querySelector('.toast-text').textContent = msg;
    var iconEl = toast.querySelector('.toast-icon');
    iconEl.innerHTML = type === 'error' ? '<i class="fas fa-exclamation"></i>' : '<i class="fas fa-check"></i>';
    toast.className = 'toast ' + (type || '') + ' show';
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(function() { toast.classList.remove('show'); }, 2200);
}

document.addEventListener('click', function(e) {
    var modal = document.getElementById('productModal');
    if (e.target === modal) closeProductModal();
});
    </script>
</body>
</html>
